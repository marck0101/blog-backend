# Atualizações de dependências (SEC-06). Um PR por semana com as menores
# agrupadas; atualização de versão major vem em PR separado, para revisar com calma.
# Alerta de segurança abre PR na hora, fora deste calendário.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      # 2.18+ puxa o htmlparser2 12 (só ESM) e a API cai na Vercel (09/11/2026).
      # tests/boot/vercel-require.test.mjs barra; voltar só quando ele passar.
      - dependency-name: sanitize-html
        versions: [">=2.18.0"]
    labels: [dependencias]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencias]
