# CI-01: todo push e PR roda os testes. PR vermelho = não fazer merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # mesma da Vercel (package.json → engines)
          cache: npm
      # O lockfile é do npm 12 (docs/OPERACAO.md); o npm 10 do Node 22 não aceita
      - run: npm install -g npm@12.2.2
      - run: npm ci
      # Banco MongoDB em memória (mongodb-memory-server); nada de DEV/PROD
      - run: npm test
      # Produção sem vulnerabilidade alta ou crítica
      - run: npm audit --omit=dev --audit-level=high
